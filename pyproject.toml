## Build system (PEP 517/518)
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

## Project metadata (PEP 621)
[project]
name = "neurovfm"
version = "0.1.0"
description = "NeuroVFM: generalist neuroimaging models"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "MLiNS Lab" }
]
keywords = ["neuroimaging", "medical-imaging", "deep-learning", "vision-transformers"]
dependencies = [
  "torch>=2.5",
  "torchvision>=0.20",
  "pytorch-lightning>=2.5",
  "torchmetrics>=1.0",
  "omegaconf>=2.3",
  "nibabel>=5.3",
  "matplotlib>=3.10",
  "huggingface-hub>=0.34",
  "einops>=0.8",
  "SimpleITK>=2.4",
  "numpy>=2.1",
  "pandas>=2.2",
  "tqdm>=4.66",
  "scipy>=1.15",
  "scikit-learn>=1.6",
  "positional-encodings>=6.0",
  "timm>=0.9.0",
  "pydantic>=2.8.0",
]

[project.urls]
Homepage = "https://github.com/MLNeurosurg/neurovfm/"
Repository = "https://github.com/MLNeurosurg/neurovfm/"

## Optional console entry points
[project.scripts]
neurovfm-train = "neurovfm.train.train:main"

## Optional dependency groups
[project.optional-dependencies]
dev = [
  "pytest==9.0.1",
]
# The report-generation VLM. outlines must stay pinned: 1.3.x moved outlines.processors.structured.
vlm = [
  "outlines==1.1.1",
  "transformers>=4.37.0",
  "peft>=0.5.0",
  "openai>=1.0.0",
]
# torch-scatter is deliberately not declared: only the MIL poolers use it, it is sdist-only on
# PyPI, and its wheels live at https://data.pyg.org/whl/. Install from there if you need MIL.

## Setuptools configuration
[tool.setuptools]
## If you later move to a src/ layout, adjust here

[tool.setuptools.packages.find]
include = ["neurovfm*"]
exclude = ["tests*"]

## Include non-Python files if needed at runtime (uncomment and adjust)
## [tool.setuptools.package-data]
## neurovfm = ["**/*.yaml", "**/*.json"]


